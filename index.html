<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrical Sync</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML =
            '<div style="padding:24px;font-family:monospace;background:#1c1c1e;color:#ff453a;height:100vh">' +
            '<h2>Failed to load application</h2>' +
            '<pre style="margin-top:12px;white-space:pre-wrap;font-size:12px">' +
            (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n' +
            (e.error && e.error.stack ? e.error.stack : '') +
            '</pre></div>';
        } else {
          console.error('Uncaught error:', e.error || e.message);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
